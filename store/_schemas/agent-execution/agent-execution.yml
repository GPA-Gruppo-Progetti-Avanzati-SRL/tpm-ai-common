name: AgentExecution
attributes:
- name: oId
  type: object-id
  options: with-filter
  tags:
    - name: json
      value: _id,omitempty
    - name: bson
      value: _id,omitempty
    - name: yaml
      value: _id,omitempty
- name: domain
  type: string
  options: with-filter
- name: site
  type: string
  options: with-filter
- name: _bid
  type: string
  options: with-filter
- name: _et
  type: string
  options: with-filter
# possible values: ready, processing, failed, completed
- name: status
  type: string
  options: with-filter
# in case of batch mode it contains the batch id returned by the APIs
- name: batch_id
  type: string
  options: with-filter
- name: weight
  type: int
# refers to target entity or entities. bidRef.bid can be a single bid or a CSV of bids
# bidRef.et is the entity type of all the specified bids.
- name: bid_ref
  type: struct
  struct-ref:
    name: BidEtPair
- name: params
  type: document
# allows to set an id to group together the items to identify an execution context or something.
- name: group
  type: string
  options: with-filter
